<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCP Builder</title>
<meta name="description" content="Write custom Lancer NPC features, templates and classes, preview them and download a COMP/CON content pack.">
<style>
:root {
  color-scheme: dark;
  --bg: #141a26; --panel: #1b2332; --panel-2: #232d3f; --line: #36435a;
  --ink: #e8ecf3; --muted: #9eabbf; --accent: #49a6a6; --accent-ink: #06201f;
  --err: #ff7b86; --warn: #f0c35a; --ok: #6fd08c; --focus: #8fd8ff;
  /* Card colours, matched by eye to COMP/CON screenshots */
  --card: #38465a; --card-text: #c9cfae; --scale: #e8475f; --tag: #7f2430;
  --weapon: #202226; --trait: #981e2b; --reaction: #016a6c; --reaction-box: #5230a6;
  --protocol: #5fb335; --protocol-box: #00747a; --tech: #7f2373; --role: #e04a5f;
  --add-bar: #49a6a6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
h1, h2, h3, p { margin: 0; }

.app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
.topbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: 16px; letter-spacing: .04em; margin-right: auto; }
.topbar h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; min-height: 32px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
.btn.small { padding: 2px 8px; min-height: 26px; font-size: 13px; }
.btn.danger:hover { border-color: var(--err); color: var(--err); }
.btn.full { width: 100%; }

.main { display: grid; grid-template-columns: 240px minmax(340px, 1fr) minmax(380px, 1.15fr); min-height: 0; }
.col { min-width: 0; overflow-y: auto; padding: 14px 16px; }
.col + .col { border-left: 1px solid var(--line); }
.foot { padding: 6px 16px; font-size: 12px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }

.side-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.side-h:first-child { margin-top: 0; }
.item { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; width: 100%; padding: 6px 8px; background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; text-align: left; }
.item:hover { background: var(--panel-2); }
.item.on { background: var(--panel-2); border-color: var(--accent); }
.item .nm { overflow-wrap: anywhere; }
.item .ty { flex: none; font-size: 11px; color: var(--muted); }
.empty { font-size: 13px; color: var(--muted); padding: 2px 8px; }

.form-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.form-h h2 { font-size: 15px; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.field { display: block; margin-bottom: 12px; }
.lab { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
.hint { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
input[type=text], input[type=number], select, textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-height: 32px; }
textarea { resize: vertical; min-height: 92px; }
textarea.mono, .mono { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 12.5px; }
fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 0 0 12px; min-width: 0; }
legend { padding: 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 12px; }
.line { display: grid; gap: 6px; align-items: center; margin-bottom: 6px; }
.line.dmg { grid-template-columns: 1.3fr repeat(3, minmax(44px, 1fr)) auto; }
.line.rng { grid-template-columns: 1.3fr 1fr auto; }
.line.tagl { grid-template-columns: 1fr 72px auto; }
.line.feat { grid-template-columns: minmax(0, 1fr) 110px auto; }
.line .t { overflow-wrap: anywhere; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; cursor: pointer; min-height: 28px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 650; }

.pv-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tabs { display: inline-flex; gap: 2px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 10px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected=true] { color: var(--ink); border-color: var(--accent); }
.issues { margin: 0 0 12px; padding: 0; list-style: none; }
.issues li { margin-bottom: 4px; }
.issues button { display: block; width: 100%; background: var(--panel); border: 0; border-left: 3px solid var(--warn); border-radius: 3px; padding: 5px 8px; text-align: left; cursor: pointer; font-size: 13px; }
.issues .err button { border-left-color: var(--err); }
.status { font-size: 13px; margin-bottom: 8px; color: var(--ok); }
.status.bad { color: var(--err); } .status.meh { color: var(--warn); }
pre.json { margin: 0; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }

.toast { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); background: #000; color: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; z-index: 5; }
.toast button { background: none; border: 0; color: var(--focus); text-decoration: underline; cursor: pointer; }

/* ---- Preview cards ---- */
.cc { font-size: 14px; }
.card { background: var(--card); color: var(--card-text); margin-bottom: 14px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
.card-h { display: flex; align-items: center; gap: 7px; padding: 2px 8px; color: #fff; font-size: 12px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
.card-h .nm { flex: 1; overflow-wrap: anywhere; }
.card-h .ty { letter-spacing: .02em; font-weight: 750; flex: none; }
.card-h svg { width: 14px; height: 14px; flex: none; fill: currentColor; }
.t-Weapon .card-h { background: var(--weapon); } .t-Trait .card-h, .t-System .card-h { background: var(--trait); }
.t-Reaction .card-h { background: var(--reaction); } .t-Tech .card-h { background: var(--tech); }
.t-System.is-protocol .card-h { background: var(--protocol); }
.card-b { padding: 8px 20px 12px; }
.sub { font-size: 11px; font-weight: 650; letter-spacing: .14em; color: #a9b3c0; text-transform: uppercase; margin-bottom: 8px; }
.eff > * { margin: 0; } .eff ul, .eff ol { padding-left: 20px; margin: 4px 0; }
.eff b, .eff strong { color: #eee; }
.scale { color: var(--scale); font-weight: 700; }
.lbl { font-size: 12px; font-weight: 650; letter-spacing: .1em; color: #a9b3c0; text-transform: uppercase; }
.stats { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px; color: #fff; font-weight: 700; }
.stat { display: inline-flex; align-items: center; gap: 4px; }
.stat svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; flex: none; }
.act { margin: 10px 8px 12px; padding: 6px 14px 12px 20px; color: #fff; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%); }
.a-Reaction { background: var(--reaction-box); } .a-Protocol { background: var(--protocol-box); } .a-Tech { background: var(--tech); }
.act-h { display: flex; align-items: flex-start; gap: 8px; }
.act-h svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; margin-top: 2px; }
.act-h .nm { flex: 1; font-size: 18px; font-weight: 800; text-transform: uppercase; overflow-wrap: anywhere; line-height: 1.25; }
.pill { flex: none; background: rgba(255,255,255,.16); padding: 2px 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%); }
.act .lbl { display: block; color: rgba(255,255,255,.5); line-height: 1.2; margin-top: 2px; }
.act .tx { padding-left: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--tag); color: #fff; padding: 4px 10px 4px 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px); }
.chip svg { width: 10px; height: 10px; fill: currentColor; }
.addbar { background: var(--add-bar); color: #06201f; padding: 3px 14px 3px 20px; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; overflow-wrap: anywhere; }

.page { background: #131925; padding: 12px; border-radius: 4px; }
.page-t { color: var(--role); font-size: 30px; font-weight: 800; text-transform: uppercase; line-height: 1.1; overflow-wrap: anywhere; }
.page-r { color: #fff; font-size: 17px; font-weight: 800; text-transform: uppercase; margin: 8px 0; }
.box { background: var(--card); color: #e4e7ea; margin-bottom: 8px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
.box-h { background: #3585d0; color: #fff; padding: 2px 10px; font-size: 11px; font-weight: 700; letter-spacing: .18em; }
.box-b { padding: 6px 20px 12px; white-space: pre-line; overflow-wrap: anywhere; }
.page-top { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.radar { width: 100%; height: auto; }
.sec { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; font-size: 12px; letter-spacing: .1em; color: #fff; text-transform: uppercase; }
.sec::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.sec span { color: var(--muted); }
.cstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px 8px; text-align: center; }
.cstats b { display: block; color: var(--role); font-size: 13px; text-transform: uppercase; }
.cstats i { color: #fff; font-style: normal; font-weight: 700; }
.cstats i s { color: var(--muted); text-decoration: none; font-weight: 400; padding: 0 3px; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 0 14px; align-items: start; }
.missing { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); padding: 6px 10px; margin-bottom: 14px; overflow-wrap: anywhere; }

/* ---- Pack summary, as in COMP/CON's content manager ---- */
.pack { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); gap: 16px; padding: 12px; margin-bottom: 14px; border-radius: 4px; }
.pack-t { grid-column: 1 / -1; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.pack-t small { font-weight: 400; opacity: .75; }
.pack-d { padding: 6px 8px; margin-bottom: 8px; white-space: pre-line; overflow-wrap: anywhere; }
.pack-k { display: block; font-weight: 700; margin: 8px 0 3px; }
.pack-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pack-chip { background: #27348b; color: #fff; border-radius: 16px; padding: 5px 16px; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
.pack-none { font-style: italic; padding-left: 8px; }
.pack-img { width: 100%; height: auto; max-height: 260px; object-fit: contain; display: block; }
.pack-noimg { display: grid; place-items: center; min-height: 120px; padding: 8px; font-size: 12px; text-align: center; border: 1px dashed currentColor; opacity: .6; }
.pack-v2 { background: #fff; color: #222; }
.pack-v2 .pack-d { background: #dcdcdc; }
.pack-v3 { background: var(--panel); color: var(--ink); }
.pack-v3 .pack-d { background: var(--card); }
.cover-pv { max-width: 180px; max-height: 120px; display: block; margin-bottom: 6px; }

/* ---- COMP/CON v2 look, matched by eye to screenshots ---- */
.v2 { --r: #6aa84f; --red: #8f1623; background: #f4f4f4; color: #222; padding: 12px; border-radius: 4px; font-family: Arial, Helvetica, sans-serif; }
.v2-title { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 8px; margin-bottom: 6px; }
.v2-title .nm { color: var(--red); font-size: 44px; font-weight: 800; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; min-width: 0; }
.v2-title .pk { flex: 1; min-width: 100px; margin-top: 4px; font-weight: 700; font-size: 13px; text-transform: uppercase; overflow-wrap: anywhere; }
.v2-role { text-align: center; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.v2-role svg { display: block; width: 44px; height: 44px; margin: 0 auto 2px; fill: var(--r); }
.v2-flavor { background: #c9c9c9; padding: 10px; font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
.v2-tac-h { color: var(--red); font-size: 17px; font-weight: 700; margin-top: 14px; text-transform: uppercase; }
.v2-tac { padding-bottom: 12px; border-bottom: 1px solid #ccc; overflow-wrap: anywhere; }
.v2-tabs { display: inline-flex; margin: 12px 0 8px; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
.v2-tabs button { background: #f7f7f7; color: #555; border: 0; padding: 6px 12px; cursor: pointer; letter-spacing: .06em; font-size: 13px; min-height: 30px; }
.v2-tabs button[aria-pressed=true] { background: #e5c9cc; color: var(--red); }
.v2-stats { display: grid; gap: 2px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #ccc; }
.v2-stats.c4 { grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); }
.v2-stats.c5 { grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); }
.v2-stats.c2 { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); border-bottom: 0; }
.v2-stat { background: #fff; text-align: center; }
.v2-stat b { display: block; background: var(--r); color: #fff; font-size: 13px; text-align: left; padding: 2px 6px; }
.v2-stat span { display: block; padding: 3px 4px; font-size: 19px; font-weight: 700; }
.v2-sec { display: inline-block; background: var(--r); color: #fff; font-size: 21px; font-weight: 700; padding: 3px 26px 3px 28px; margin: 12px 0 8px -4px; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.v2-card { margin: 0 0 16px; --c: #9b1c28; }
.v2-Weapon { --c: #1f1f1f; } .v2-System { --c: #57b431; } .v2-Reaction { --c: var(--reaction); } .v2-Tech { --c: var(--tech); }
.v2-h { background: var(--c); color: #fff; padding: 4px 34px 4px 8px; clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 100%, 0 100%); overflow-wrap: anywhere; }
.v2-n { font: 700 17px/1.2 ui-monospace, Consolas, Menlo, monospace; text-transform: uppercase; }
.v2-s { font-size: 12px; text-transform: uppercase; }
.v2-b { background: #ededed; border: 1px solid var(--c); border-top: 0; padding: 8px; overflow-wrap: anywhere; }
.v2-l { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin: 4px 0 2px; }
.v2-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.v2-row > * { display: inline-flex; align-items: center; gap: 4px; }
.v2-row .sp { flex: 1; justify-content: center; text-transform: uppercase; }
.v2-row .wt { margin-left: auto; text-transform: uppercase; }
.v2-row svg { width: 15px; height: 15px; fill: none; stroke: #666; stroke-width: 2; flex: none; }
.v2-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.v2-chip { display: inline-flex; align-items: center; gap: 5px; background: #9b1c28; color: #fff; border-radius: 4px; padding: 3px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
.v2-chip svg { width: 11px; height: 11px; fill: currentColor; }
.v2 .scale { color: var(--red); }
.v2 .eff b, .v2 .eff strong { color: inherit; }
.v2 .missing { border-color: #aaa; color: #555; }

@media (max-width: 1100px) {
  .app { height: auto; min-height: 100vh; }
  .main { grid-template-columns: 1fr; }
  .col { overflow: visible; }
  .col + .col { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 480px) { .two, .pack { grid-template-columns: 1fr; } .page-top { grid-template-columns: 1fr; } .v2-title .nm { font-size: 34px; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>LCP Builder <small>Custom Lancer foes and systems for COMP/CON</small></h1>
    <button class="btn" id="b-new" type="button">New pack</button>
    <button class="btn" id="b-example" type="button">Load example</button>
    <button class="btn" id="b-open" type="button">Open .lcp</button>
    <input id="file" type="file" accept=".lcp,.zip" hidden>
    <button class="btn primary" id="b-dl" type="button">Download .lcp</button>
  </header>
  <main class="main">
    <nav class="col" id="side" aria-label="Pack contents"></nav>
    <section class="col" id="form" aria-label="Editor"></section>
    <section class="col" id="right" aria-label="Preview and checks"></section>
  </main>
  <footer class="foot">Unofficial fan tool, not affiliated with Massif Press. The previews approximate COMP/CON v3 and v2. Your work stays in this browser.</footer>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  const p = props || {};
  for (const k in p) {
    const v = p[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : String(c)); });
  if ('value' in p && p.value != null) e.value = p.value; // select options exist only now
  return e;
}
function svg(body, box = '0 0 24 24') {
  const t = document.createElement('template');
  t.innerHTML = `<svg viewBox="${box}" aria-hidden="true">${body}</svg>`;
  return t.content.firstChild;
}
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => String(s || '').toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };

/* Icons are simple shapes drawn for this tool. */
const ICON = {
  Weapon: '<path d="M4 3l9 9-2 2-9-9V3zM20 3h2v2l-9 9-2-2zM5 15l4 4-2 2-1-1-2 2-2-2 2-2-1-1zM19 15l2 2-1 1 2 2-2 2-2-2-1 1-2-2z"/>',
  Trait: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>',
  System: '<path d="M12 2l3 4 5-1-1 5 4 2-4 2 1 5-5-1-3 4-3-4-5 1 1-5-4-2 4-2-1-5 5 1zm0 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>',
  Reaction: '<path d="M2 12c3-5 7-7 10-7s7 2 10 7c-3 5-7 7-10 7s-7-2-10-7zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>',
  Tech: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 5h2v4h4v2h-4v4h-2v-4H7v-2h4z"/>',
  layers: '<path d="M12 3l10 5-10 5L2 8zM4 12l8 4 8-4 2 1-10 5-10-5zm0 4l8 4 8-4 2 1-10 5-10-5z"/>',
  tag: '<path d="M1 1h10l12 12-10 10L1 11zm5 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>',
  range: '<circle cx="12" cy="12" r="8"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6"/>',
  threat: '<path d="M4 4l6 6M20 4l-6 6M4 20l6-6M20 20l-6-6"/><circle cx="12" cy="12" r="4"/>',
  damage: '<circle cx="12" cy="12" r="9"/><path d="M5 19L19 5"/>',

const KNOWN = new Set(['id', 'name', 'origin', 'locked', 'type', 'effect', 'tags', 'trigger', 'weapon_type', 'attack_bonus', 'accuracy', 'damage', 'range', 'on_hit', 'tech_type']);

  const ta = h('textarea', { class: 'mono', rows: 4, value: Object.keys(extras).length ? JSON.stringify(extras, null, 2) : '', 'aria-label': 'Extra JSON fields', oninput: e => {

      const v = e.target.value.trim() ? JSON.parse(e.target.value) : {};

      Object.keys(f).forEach(k => { if (!KNOWN.has(k)) delete f[k]; });
      Object.entries(v).forEach(([k, x]) => { if (!KNOWN.has(k)) f[k] = x; });
      msg.textContent = 'Saved.'; msg.style.color = '';

function idField(kind, x, onRename) {

function nameField(kind, x, setName, setId) {
  return field('Name', h('input', { type: 'text', value: x.name ?? '', oninput: e => {

function uniqueOther(base, self) {
  const used = new Set([...S.features, ...S.templates, ...S.classes].filter(o => o !== self).map(o => o.id));

  while (used.has(id)) id = base + '_' + n++;

}

/* ---------- forms ---------- */

  return [
    h('div', { class: 'form-h' }, h('h2', null, 'Pack details')),

    field('Website (optional)', textIn(() => m.website, v => { if (v) m.website = v; else delete m.website; })),

    Object.keys(S.other).length ? h('p', { class: 'hint' }, `Also keeping ${Object.keys(S.other).length} other file(s) from the pack you opened: ${Object.keys(S.other).join(', ')}.`) : null,

function formFeature(f) {

      h('datalist', { id: 'wt' }, WEAPON_TYPES.map(w => h('option', { value: w }))),

/* ---------- render ---------- */
function renderSide() {
  const item = (kind, i, label, ty) => h('button', { class: 'item' + (sel.kind === kind && sel.i === i ? ' on' : ''), type: 'button', 'aria-current': sel.kind === kind && sel.i === i ? 'true' : null, onclick: () => { sel = { kind, i }; renderAll(); } },
    h('span', { class: 'nm' }, label || 'Unnamed'), ty ? h('span', { class: 'ty' }, ty) : null);
  const section = (title, add, kids) => [h('div', { class: 'side-h' }, title, add), kids.length ? kids : h('p', { class: 'empty' }, 'None yet')];
  $('#side').replaceChildren(...[
    item('pack', 0, S.manifest.name || 'Pack details', 'Pack'),
    section('Features', h('button', { class: 'btn small', type: 'button', onclick: () => newFeature(), 'aria-label': 'New feature' }, '+'), S.features.map((f, i) => item('feature', i, f.name, f.type))),
    section('Templates', h('button', { class: 'btn small', type: 'button', onclick: newTemplate, 'aria-label': 'New template' }, '+'), S.templates.map((t, i) => item('template', i, t.name))),
    section('Classes', h('button', { class: 'btn small', type: 'button', onclick: newClass, 'aria-label': 'New class' }, '+'), S.classes.map((c, i) => item('class', i, c.name, c.role)))

function renderForm() {
  const it = cur();
  if (!it) sel = { kind: 'pack', i: 0 };
  const b = sel.kind === 'pack' ? formPack() : sel.kind === 'feature' ? formFeature(cur()) : sel.kind === 'template' ? formTemplate(cur()) : formClass(cur());
  $('#form').replaceChildren(...b.flat(Infinity).filter(Boolean));
}
function jsonFor() {
  if (sel.kind === 'pack') return { file: 'lcp_manifest.json', data: S.manifest };
  return { file: { feature: 'npc_features.json', template: 'npc_templates.json', class: 'npc_classes.json' }[sel.kind], data: cur() };
}
function renderRight() {
  if (style === 'v2' && !tier) tier = 1; // v2 pages only ever show one tier

  const errs = issues.filter(i => i.lvl === 'err').length, warns = issues.length - errs;
  const tabBtn = (id, label) => h('button', { type: 'button', role: 'tab', 'aria-selected': rightTab === id ? 'true' : 'false', onclick: () => { rightTab = id; renderRight(); } }, label);
  const head = h('div', { class: 'pv-h' },
    h('div', { class: 'tabs', role: 'tablist' }, tabBtn('preview', 'Preview'), tabBtn('checks', `Checks (${issues.length})`), tabBtn('json', 'JSON')),
    rightTab === 'preview' ? h('div', { class: 'row' },
      h('div', { class: 'seg', role: 'group', 'aria-label': 'COMP/CON version shown in preview' },
        [['v3', 'V3'], ['v2', 'V2']].map(([v, l]) => h('button', { type: 'button', 'aria-pressed': style === v ? 'true' : 'false', onclick: () => setStyle(v) }, l))),
      h('div', { class: 'seg', role: 'group', 'aria-label': 'Tier shown in preview' },
        (style === 'v2' ? [[1, 'T1'], [2, 'T2'], [3, 'T3']] : [[0, 'All tiers'], [1, 'T1'], [2, 'T2'], [3, 'T3']]).map(([v, l]) => h('button', { type: 'button', 'aria-pressed': tier === v ? 'true' : 'false', onclick: () => { tier = v; renderRight(); } }, l)))) : null);
  const status = h('div', { class: 'status' + (errs ? ' bad' : warns ? ' meh' : ''), role: 'status' },
    errs ? `${errs} problem${errs > 1 ? 's' : ''} to fix before importing${warns ? `, ${warns} to review` : ''}.` : warns ? `Ready to download, with ${warns} thing${warns > 1 ? 's' : ''} to review.` : 'Ready to download.');
  let body;
  if (rightTab === 'checks') {
    body = issues.length ? h('ul', { class: 'issues' }, issues.map(i => h('li', { class: i.lvl }, h('button', { type: 'button', onclick: () => { sel = i.sel; rightTab = 'preview'; renderAll(); } }, (i.lvl === 'err' ? 'Fix: ' : 'Check: ') + i.msg)))) : h('p', { class: 'empty' }, 'Nothing to report.');
  } else if (rightTab === 'json') {
    const j = jsonFor();
    const shown = JSON.stringify(j.data, (k, v) => k === 'image_url' && isEmbedded(v) ? `(embedded image, ${v.length} characters)` : v, 2);
    body = [h('p', { class: 'hint', style: 'margin-bottom:6px' }, `This entry, as written to ${j.file}:`), h('pre', { class: 'json mono' }, shown)];
  } else {
    const it = cur();
    body = h('div', { class: 'cc' },
      sel.kind === 'feature' ? (style === 'v2' ? h('div', { class: 'v2' }, cardV2(it)) : [card(it, 'picker'), it.origin && it.origin.base ? null : h('p', { class: 'hint' }, 'As shown when picking optional features for an NPC.')])
      : sel.kind === 'template' ? (style === 'v2' ? templatePageV2(it) : templatePage(it))
      : sel.kind === 'class' ? (style === 'v2' ? classPageV2(it) : classPage(it))
      : [packCard(), S.features.length
          ? (style === 'v2' ? h('div', { class: 'v2' }, S.features.map(cardV2)) : [h('div', { class: 'sec' }, 'All features'), S.features.map(f => card(f))])
          : h('p', { class: 'empty' }, 'Add a feature with the + button, or use Load example to see one.')]);
  }
  $('#right').replaceChildren(...[head, status, body].flat(Infinity).filter(Boolean));
}
function renderAll() { renderSide(); renderForm(); renderRight(); }

/* ---------- top bar ---------- */
$('#b-new').addEventListener('click', () => { snapshot(); S = blank(); sel = { kind: 'pack', i: 0 }; commit(true); toast('Started a new pack.', true); });
$('#b-example').addEventListener('click', () => { snapshot(); S = exampleData(); sel = { kind: 'feature', i: 0 }; commit(true); toast("Loaded Captain's Deflect.", true); });
$('#b-open').addEventListener('click', () => $('#file').click());
$('#b-dl').addEventListener('click', download);
$('#file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const next = await importBytes(await file.arrayBuffer());
    snapshot(); S = next; sel = { kind: 'pack', i: 0 }; commit(true);
    toast(`Opened ${S.manifest.name || file.name}: ${S.features.length} features.`, true);
  } catch (err) { toast("Couldn't open that file. " + err.message); }
});

/* Small surface for automated checks. */
window.lcpWorkbench = { get state() { return S; }, set state(v) { S = v; sel = { kind: 'pack', i: 0 }; renderAll(); }, importBytes, packBytes, validate, select(kind, i) { sel = { kind, i }; renderAll(); }, setTier(t) { tier = t; renderRight(); }, setStyle };

load();
renderAll();
</script>
